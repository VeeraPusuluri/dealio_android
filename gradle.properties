# JVM heap for the Gradle daemon (machine has 16 GB). 2g was too small and
# caused GC pressure while dexing/packaging.
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8
# Run independent tasks in parallel.
org.gradle.parallel=true
# Reuse task outputs across builds (e.g. dexing of unchanged libraries).
org.gradle.caching=true
# Skip re-running the configuration phase when nothing relevant changed.
org.gradle.configuration-cache=true
# Keep building modules even if one fails (better feedback).
org.gradle.configureondemand=true

# Backend the release build talks to. The CloudFront distribution is the only
# deployed backend today (dev env: CloudFront -> ALB -> EC2:8090); a production
# domain is not provisioned yet — terraform's prod_host is unset and
# api.dealio.app does not resolve. Point a release build somewhere else without
# touching build.gradle.kts:
#   ./gradlew :app:bundleRelease -Pdealio.apiBaseUrl=https://api.example.com/api/
# Keep the trailing slash — Retrofit resolves endpoints relative to it.
dealio.apiBaseUrl=https://d2l7qgxnnc8786.cloudfront.net/api/

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Faster Kotlin incremental compilation + dedicated daemon heap.
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx2048m
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
